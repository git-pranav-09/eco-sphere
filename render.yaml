services:
  - type: web
    name: echo-sphere
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echo-sphere-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INITIAL_SUPER_ADMIN_EMAIL
        sync: false
databases:
  - name: echo-sphere-db
    plan: free
    databaseName: echo_sphere
    user: echo_sphere_user
